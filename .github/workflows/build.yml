name: Build
on:
  schedule: [{cron: '0 4 * * *'}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: build, cancel-in-progress: true}
jobs:
  build:  # fetches untrusted playlists: read-only token, no saved credentials
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a feed that trickles bytes can't hold the job
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python build.py --test && python build.py
      - uses: actions/upload-artifact@v4
        with: {name: site, path: site}
  publish:  # pushes the built files to the site branch as one commit
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: site, path: site}
      - env:  # git dir outside the artifact, no hooks, token via header not URL
          GIT_DIR: ${{ runner.temp }}/git
          GIT_WORK_TREE: site
          AUTH: ${{ github.token }}
        run: |
          git init -q -b site
          git config core.hooksPath /dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -qm "Build $(date -u +%F)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AUTH" | base64 -w0)"             push -qf "https://github.com/${{ github.repository }}" site
