name: Build
on:
  schedule: [{cron: '0 4 * * *'}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
concurrency: {group: build, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python build.py --test && python build.py
      - name: Publish to the site branch (one commit, no history)
        working-directory: site
        run: |
          git init -q -b site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -qm "Build $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site
